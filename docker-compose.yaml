x-airflow-common: &airflow-common
  image: job-market-airflow:2.10.0
  build:
    context: .
    dockerfile: Dockerfile.airflow
  working_dir: /opt/airflow/project

  env_file:
    - .env

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/job_pipeline
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    PYTHONPATH: /opt/airflow/project
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/project/src
    - ./data:/opt/airflow/project/data
    - ./state:/opt/airflow/project/state
    - ./process_jobs.py:/opt/airflow/project/process_jobs.py
    - ./load_warehouse.py:/opt/airflow/project/load_warehouse.py
    - ./.env:/opt/airflow/project/.env:ro

  depends_on:
    postgres:
      condition: service_healthy
  
services:

  postgres:
    image: postgres:16

    container_name: postgres

    restart: always

    env_file:
      - .env

    ports:
      - "5433:5432"

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  airflow-init:
    <<: *airflow-common

    container_name: airflow-init

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create \
      --username admin \
      --firstname Shubham \
      --lastname Patil \
      --role Admin \
      --email admin@example.com \
      --password "$${AIRFLOW_ADMIN_PASSWORD}"
      "

  airflow-webserver:
    <<: *airflow-common

    container_name: airflow-webserver

    command: webserver

    ports:
      - "8080:8080"

    restart: always

  airflow-scheduler:
    <<: *airflow-common

    container_name: airflow-scheduler

    command: scheduler

    restart: always

volumes:

  postgres-db-volume: